# Produksi di VPS Tencent Jakarta (43.173.51.136), folder /opt/native-apps/rftdigitalsolution_web.
# HTTPS ditangani Caddy bersama (/opt/native-apps/caddy) lewat jaringan Docker eksternal `proxy`:
#   rftdigitalsolution.com    -> native_rft_web:3000
#   s3.rftdigitalsolution.com -> minio:9000   (MinIO BERSAMA di /opt/native-apps/minio, bucket rft-blog-images)
# Tidak ada port yang dibuka ke internet. Kredensial S3 (user `rft`, hanya bisa akses bucket-nya sendiri)
# dibuat dengan /opt/native-apps/minio/add-project.sh dan disimpan di .env.
#
# Database: Postgres BERSAMA di VPS (container `smartles_db`, project smartles) — JANGAN tambah Postgres baru.
# RFT memakai role `rft` + database `rft_blog` di sana, dicapai lewat jaringan Docker `smartles_internal`.
# .env: POSTGRES_USER=rft, POSTGRES_PASSWORD=<password role rft>, POSTGRES_DB=rft_blog.
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env up -d --build
#
# Sinkron skema Prisma (project memakai db push, tanpa folder migrations):
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env --profile tools run --rm prisma-setup
# Buat / reset akun admin:
#   docker compose -f deploy/docker-compose.prod.yml --env-file .env --profile tools run --rm prisma-setup \
#     sh -c "npm ci && npm run admin:create -- --email nama@domain.com --name 'Nama'"
name: rftdigitalsolution_web

services:
  nextjs:
    build:
      context: ..
      dockerfile: Dockerfile
    image: native_rft_web:latest
    container_name: native_rft_web
    restart: unless-stopped
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?isi AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:?isi AUTH_URL}
      NEXTAUTH_URL: ${AUTH_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-${AUTH_URL}}
      DATABASE_URL: postgresql://${POSTGRES_USER:?isi POSTGRES_USER}:${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD}@smartles_db:5432/${POSTGRES_DB:?isi POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@cache:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?isi REDIS_PASSWORD}
      S3_ENDPOINT: ${S3_ENDPOINT:?isi S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?isi S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?isi S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:?isi S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION:-us-east-1}
    depends_on:
      cache:
        condition: service_started
    networks: [internal, proxy, shared-db]

  cache:
    # Redis hanya untuk cache blog (TTL 60 dtk): tanpa persistensi, RAM dibatasi 64 MB.
    image: redis:7.4-alpine
    container_name: native_rft_cache
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    networks: [internal]

  # Alat sekali pakai: prisma db push / seed / admin:create (image produksi tidak berisi Prisma CLI).
  prisma-setup:
    image: node:20-bookworm-slim
    profiles: [tools]
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?isi POSTGRES_USER}:${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD}@smartles_db:5432/${POSTGRES_DB:?isi POSTGRES_DB}
      NODE_ENV: development
    networks: [shared-db]
    command: sh -c "npm ci && npx prisma generate && npx prisma db push"

networks:
  internal:
  proxy:
    external: true
  # Jaringan internal project smartles, tempat Postgres bersama (smartles_db) berada.
  shared-db:
    external: true
    name: smartles_internal
